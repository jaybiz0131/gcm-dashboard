name: Traffic pull

on:
  schedule:
    # Daily 05:00 UTC, about 01:00 ET. Deliberately just after the UTC day
    # rolls over: the pull counts complete UTC days only, so running at 23:00
    # UTC used to exclude the day that had just ended and left the dashboard
    # ~2 days behind. Sundays the run also writes the weekly briefing and the
    # Lighthouse lab pass (gated inside the script).
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      force_weekly:
        description: "Also run the Sunday-only work (weekly report + Lighthouse)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: traffic-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Pull traffic, update history, write report
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          # accepts either secret name; ANTHROPIC_KEY is what exists on this repo
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.ANTHROPIC_KEY }}
          GCM_FORCE_WEEKLY: ${{ inputs.force_weekly && '1' || '' }}
        run: python3 scripts/pull_traffic.py

      - name: Commit and push
        run: |
          git config user.name "gcm-dashboard-bot"
          git config user.email "gcm-dashboard-bot@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            STAMP=$(python3 -c "import json; h = json.load(open('data/traffic-history.json')); print('daily thru ' + h['days'][-1]['date'] if h.get('days') else 'week ending ' + h['weeks'][-1]['week_ending'])")
            git commit -m "traffic: $STAMP"
            git push
          fi

      - name: Open an issue on experience regression
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let alerts = [];
            try {
              alerts = JSON.parse(fs.readFileSync('data/alerts-latest.json', 'utf8')).alerts || [];
            } catch (e) { /* no alerts file, nothing to do */ }
            if (!alerts.length) { console.log('No regressions.'); return; }
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Experience regression, ${today}`,
              body: 'The daily pull found newly-regressed experience metrics:\n\n'
                + alerts.map(a => `- ${a}`).join('\n')
                + '\n\nAlerts are transition-based: each metric alerts once when it turns poor, then stays quiet until it recovers and regresses again.',
            });

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Traffic pull failed, ${new Date().toISOString().slice(0, 10)}`,
              body: `The daily traffic pull failed before committing anything, so the published data is untouched. Run log: ${runUrl}`,
            });
